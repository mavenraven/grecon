name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build (arm64)
        run: GOARCH=arm64 GOOS=darwin go build -ldflags "-X main.version=${{ github.ref_name }}" -o grecon-darwin-arm64 .

      - name: Build (x86_64)
        run: GOARCH=amd64 GOOS=darwin go build -ldflags "-X main.version=${{ github.ref_name }}" -o grecon-darwin-amd64 .

      - name: Build (linux arm64)
        run: GOARCH=arm64 GOOS=linux go build -ldflags "-X main.version=${{ github.ref_name }}" -o grecon-linux-arm64 .

      - name: Build (linux x86_64)
        run: GOARCH=amd64 GOOS=linux go build -ldflags "-X main.version=${{ github.ref_name }}" -o grecon-linux-amd64 .

      - name: Publish release
        run: |
          chmod +x grecon-*
          PRERELEASE=""
          if [[ "${{ github.ref_name }}" == *"-rc"* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" grecon-* \
            --title "grecon ${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
